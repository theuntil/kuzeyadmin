# ############################################################
#  Kuzeybatı Haber — Yönetim Paneli
#
#  Dokploy: Compose Type = docker-compose
#  Ortam değişkenlerini Dokploy'un "Environment" sekmesine gir.
#
#  BUILD ARG YOK — bilerek.
#  Dokploy compose-interpolation aşamasında değişkenleri her zaman
#  vermiyor ("variable is not set" uyarısı). Bu yüzden Supabase
#  ayarları DERLEME anında değil, ÇALIŞMA anında okunuyor.
#  Böylece aynı imaj farklı ortamlarda yeniden derlenmeden
#  kullanılabiliyor.
# ############################################################
services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # ┌─ BU LİSTE BEYAZ LİSTEDİR ⚠️ ────────────────────────────┐
    # │ Burada YAZMAYAN bir değişken, Dokploy'un Environment      │
    # │ sekmesine girilse bile konteynere ULAŞMAZ.                │
    # │                                                            │
    # │ Yaşanan hata: S3_* değişkenleri girildi ama listede        │
    # │ olmadığı için medya yükleme                                │
    # │   "[yukleme] R2 yapılandırması eksik"                      │
    # │ diyordu. Yeni bir değişken eklerken BURAYA DA EKLE.        │
    # └────────────────────────────────────────────────────────────┘
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      # ---- Supabase (çalışma anında okunur, NEXT_PUBLIC_ YOK) ----
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SITE_URL: ${SITE_URL:-https://kuzeybatihaber.com.tr}
      CDN_BASE: ${CDN_BASE:-https://medya.kuzeybatihaber.com.tr}

      # ---- Cloudflare R2 (logo, favicon, medya kitaplığı) ----
      # ⚠ Bu anahtarlar SUNUCUDA kalır; tarayıcıya hiç gitmez.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-haber-medya}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      # ---- Mail servisi (panelden mail yazmak için) ----
      MAIL_API_URL: ${MAIL_API_URL:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}

    expose:
      - "3000"
    ports:
      - "3000"

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/giris').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
